<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="var(--green)">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
      </svg>
      <span>Mood<strong>Tracker</strong></span>
    </div>
    <a href="index.html" class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
      Songs
    </a>
    <a href="create.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
      </svg>
      Add Song
    </a>
    <a href="reports.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/>
      </svg>
      Reports
    </a>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <h1>Your Library</h1>
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--text-muted)">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="search" placeholder="Search songs or artists..." />
      </div>
      <a href="create.html" class="btn btn-primary">+ Add Song</a>
    </div>

    <div class="filters">
      <select class="filter-select" id="mood-filter">
        <option value="">All Moods</option>
        <option value="happy">Happy</option>
        <option value="sad">Sad</option>
        <option value="energetic">Energetic</option>
        <option value="calm">Calm</option>
        <option value="angry">Angry</option>
        <option value="relaxed">Relaxed</option>
      </select>
      <select class="filter-select" id="sort-filter">
        <option value="created_at">Recently Added</option>
        <option value="title">Title A-Z</option>
        <option value="mood">By Mood</option>
      </select>
      <select class="filter-select" id="order-filter">
        <option value="desc">Descending</option>
        <option value="asc">Ascending</option>
      </select>
      <span id="total-count" style="color:var(--text-muted);font-size:0.85rem;margin-left:auto;"></span>
    </div>

    <div class="songs-grid" id="songs-grid"></div>
    <div class="pagination" id="pagination"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/songs.js"></script>
</body>
</html>
