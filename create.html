<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Song — MoodTracker</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="var(--green)">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
      </svg>
      <span>Mood<strong>Tracker</strong></span>
    </div>
    <a href="index.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
      Songs
    </a>
    <a href="create.html" class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
      </svg>
      Add Song
    </a>
    <a href="reports.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/>
      </svg>
      Reports
    </a>
  </aside>

  <main class="main-content">
    <a href="index.html" class="btn btn-secondary" style="margin-bottom:24px;display:inline-flex">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      Back
    </a>

    <h1 id="page-title" style="font-size:2rem;font-weight:700;margin-bottom:32px">Add Song</h1>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start">

      <div class="form-container" style="max-width:100%">
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input class="form-input" type="text" id="title" placeholder="Song title" />
        </div>

        <div class="form-group">
          <label class="form-label">Artist *</label>
          <select class="form-select" id="artist-id">
            <option value="">Select an artist...</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Album</label>
          <select class="form-select" id="album-id">
            <option value="">No album</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Mood *</label>
          <select class="form-select" id="mood">
            <option value="">Select a mood...</option>
            <option value="happy">Happy</option>
            <option value="sad">Sad</option>
            <option value="energetic">Energetic</option>
            <option value="calm">Calm</option>
            <option value="angry">Angry</option>
            <option value="relaxed">Relaxed</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Source *</label>
          <select class="form-select" id="source">
            <option value="manual">Manual</option>
            <option value="spotify">Spotify</option>
          </select>
        </div>

        <div style="display:flex;gap:12px;margin-top:8px">
          <button class="btn btn-primary" id="btn-submit" style="flex:1; display:flex; justify-content:center; align-items:center; text-align:center">
            Save Song
          </button>
          <a href="index.html" class="btn btn-secondary">Cancel</a>
        </div>
      </div>

      <div>
        <label class="form-label">Cover Image</label>
        <div class="image-upload-area" id="upload-area">
          <img id="image-preview" class="image-preview"
            src="assets/placeholder.jpg" alt="Cover preview" />
          <p style="color:var(--text-muted);font-size:0.85rem;margin-top:8px">
            Click to upload or drag & drop
          </p>
          <p style="color:var(--surface-3);font-size:0.75rem;margin-top:4px">
            JPG, PNG, WEBP — max 1MB
          </p>
          <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" hidden />
        </div>
        <p style="color:var(--text-muted);font-size:0.8rem;margin-top:8px">
          Image will be uploaded after saving the song.
        </p>
      </div>

    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
